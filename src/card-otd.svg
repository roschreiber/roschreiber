<svg xmlns="http://www.w3.org/2000/svg" width="423" height="248" viewBox="0 0 423 248">
<title>OTD-Redux, a revived minecraft dungeon plugin</title>
<style>
  @font-face { font-family: "Quicksand"; font-weight: 500; src: url({{quicksand-500.woff2}}); }
  @font-face { font-family: "Quicksand"; font-weight: 700; src: url({{quicksand-700.woff2}}); }

  text {
    font-family: "Quicksand", sans-serif;
    font-weight: 500;
  }

  .title {
    font-size: 20px;
    font-weight: 700;
    fill: #111;
  }

  .desc {
    font-size: 13.5px;
    fill: #666;
  }

  .tag {
    fill: #e7e7e7;
  }

  .tag-text {
    font-size: 11.5px;
    font-weight: 700;
    fill: #555;
    text-anchor: middle;
  }

  .slide {
    opacity: 0;
    animation: slide 15s infinite;
  }

  @keyframes slide {
    0% { opacity: 0; }
    5% { opacity: 1; }
    20% { opacity: 1; }
    25% { opacity: 0; }
  }

  .bob {
    animation: bob 2s ease-in-out infinite alternate;
  }

  @keyframes bob {
    to { transform: translateY(-4px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
    }
  }
</style>

<defs>
  <clipPath id="pic">
    <rect x="15" y="10" width="393" height="140" rx="10" />
  </clipPath>
</defs>

<rect x="5.5" y="0.5" width="412" height="243" rx="16" fill="#f6f6f6" stroke="#dcdcdc" />

<g clip-path="url(#pic)">
  <image href="{{otd-1.webp}}" x="15" y="10" width="393" height="140" />
  <image class="slide" href="{{otd-2.webp}}" x="15" y="10" width="393" height="140" style="animation-delay: 3s" />
  <image class="slide" href="{{otd-3.webp}}" x="15" y="10" width="393" height="140" style="animation-delay: 6s" />
  <image class="slide" href="{{otd-4.webp}}" x="15" y="10" width="393" height="140" style="animation-delay: 9s" />
  <image class="slide" href="{{otd-5.webp}}" x="15" y="10" width="393" height="140" style="animation-delay: 12s" />
  <image class="bob" href="{{otd-logo.webp}}" x="27" y="20" width="112" height="76" />
</g>

<text class="title" x="20" y="180">OTD-Redux</text>
<text class="desc" x="20" y="202">a revived minecraft dungeon plugin</text>

<rect class="tag" x="352" y="164" width="52" height="22" rx="6" />
<path transform="translate(360 169) scale(0.5)" fill="#555" stroke="#555" stroke-width="2" stroke-linejoin="round" d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" />
<text class="tag-text" x="387" y="179">{{stars}}</text>

<rect class="tag" x="20" y="214" width="40" height="20" rx="6" />
<text class="tag-text" x="40" y="228">Java</text>

<rect class="tag" x="66" y="214" width="72" height="20" rx="6" />
<text class="tag-text" x="102" y="228">Minecraft</text>

<rect class="tag" x="144" y="214" width="49" height="20" rx="6" />
<text class="tag-text" x="168.5" y="228">Paper</text>
</svg>
